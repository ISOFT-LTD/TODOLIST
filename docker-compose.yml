services:
  todo-plugin:
    build: .
    image: todo-plugin:1.0.0
    container_name: todo-plugin
    ports:
      - "8000:8000"
    volumes:
      # Keeps /data/todos.json across restarts and recreates.
      - todo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  todo-data:
