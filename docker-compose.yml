# The Todo app, installed beside Cobalt Core.
#
#   browser --> Core /apps/todo/...  --> todo-frontend (:8080) --> todo-backend
#               (session cookie)          page + /api hand-off      verifies Core's JWT
#
# The browser only ever talks to Core. todo-frontend is published on this
# machine's loopback address alone - Core is given it as
# COBALT_APP_URL_TODO=http://127.0.0.1:8080 - and todo-backend has no published
# port at all. Settings come from a .env file beside this one (.env.example).
#
# This file runs the app without Forge. Under Forge the same two images run as
# the compose project forge-todo, from pulsar.yaml; do not run both on one
# server. Both images build from this folder, the one that holds pulsar.yaml.
services:
  todo-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/itec-git/apps/todo-backend:1.3.0
    container_name: todo-backend
    environment:
      COBALT_AUDIENCE: todo
      COBALT_ISSUER: ${COBALT_ISSUER:-cobalt-core}
      COBALT_TENANT_ID: ${COBALT_TENANT_ID:-}
      # Core's public keys: its JWKS URL, or a saved copy placed in ./cobalt/.
      COBALT_CORE_JWKS_URL: ${COBALT_CORE_JWKS_URL:-}
      COBALT_CORE_JWKS_FILE: ${COBALT_CORE_JWKS_FILE:-}
    volumes:
      # Keeps /data/todos.json and /data/predefined_lists.json across restarts and recreates.
      - todo-data:/data
      # For the JWKS-file option: COBALT_CORE_JWKS_FILE=/run/cobalt/core-jwks.json
      - ./cobalt:/run/cobalt:ro
    extra_hosts:
      # Core's hostname resolves to this machine inside the container, so a
      # JWKS URL on Core's real name reaches the Core running beside it - and
      # passes TLS verification against Core's certificate.
      - "${CORE_HOSTNAME:-core.invalid}:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  todo-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ghcr.io/itec-git/apps/todo-frontend:1.3.0
    container_name: todo-frontend
    environment:
      TODO_BACKEND_URL: http://todo-backend:8000
    ports:
      # Loopback only: Core, beside it, is the one caller. Not for a browser.
      - "${TODO_BIND_ADDRESS:-127.0.0.1}:${TODO_PORT:-8080}:8080"
    depends_on:
      # nginx resolves the backend's name when it starts.
      todo-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  todo-data:
